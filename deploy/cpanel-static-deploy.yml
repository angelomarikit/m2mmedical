---
# Branch cpanel-release: repo root IS the Vite build (index.html, assets/, .htaccess).
# Target: /home/mmmedica/public_html/ — NOT a subfolder.
# NOTE: Each .cpanel.yml line is a separate shell on cPanel; DEPLOYPATH must live in one -c block.

deployment:
  tasks:
    - /bin/sh -c 'set -eu; DEPLOYPATH="__DEPLOYPATH__"; REPO=/home/mmmedica/repositories/m2mmedical; cd "$REPO"; echo "=== M2M publish: $REPO -> $DEPLOYPATH ==="; test -f index.html || (echo "ERROR: index.html missing — track branch cpanel-release and Update from Remote" && exit 1); chmod +x cpanel-publish.sh 2>/dev/null || true; /bin/sh cpanel-publish.sh "$DEPLOYPATH" .; echo "Check public_html/index.html and public_html/assets/ dates after deploy."'
