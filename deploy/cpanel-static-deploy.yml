---
# Branch cpanel-release: checkout root IS the Vite build (index.html, assets/, .htaccess).
# Target: domain document root — NOT public_html/m2mmedical-main or other subfolders.

deployment:
  tasks:
    - export DEPLOYPATH=__DEPLOYPATH__
    - /bin/echo "=== M2M static publish → $DEPLOYPATH (merge only, no delete) ==="
    - /bin/test -f index.html || (/bin/echo "ERROR: index.html missing on cpanel-release branch" && /bin/false)
    - /bin/chmod +x cpanel-publish.sh 2>/dev/null || true
    - /bin/sh cpanel-publish.sh "$DEPLOYPATH" .
    - /bin/echo "Verify https://m2mmedical.com/ and https://m2mmedical.com/admin/login"
