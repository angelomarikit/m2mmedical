---
# Used on branch cpanel-release (built site only). Generated by GitHub Actions — edit deploy/DEPLOYPATH on main.
deployment:
  tasks:
    - export DEPLOYPATH=__DEPLOYPATH__
    - /bin/echo "Publishing static site to $DEPLOYPATH"
    - /bin/test -f index.html || (/bin/echo "ERROR: index.html missing in deployment checkout" && /bin/false)
    - /bin/mkdir -p "$DEPLOYPATH"
    - if command -v rsync >/dev/null 2>&1; then rsync -a --exclude=.cpanel.yml ./ "$DEPLOYPATH/"; else /bin/sh -c 'for f in *; do [ "$f" = .cpanel.yml ] && continue; /bin/cp -R "$f" "$DEPLOYPATH/"; done'; fi
