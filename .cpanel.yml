---
# Branch main = source only. Do NOT deploy from main on cPanel.
# Production static files live on branch cpanel-release (built by GitHub Actions).
# cPanel Git → set Branch to cpanel-release → Update from Remote → Deploy HEAD Commit.

deployment:
  tasks:
    - /bin/sh -c 'echo "ERROR: This repository checkout is branch main (source). cPanel must track branch cpanel-release for production deploy."; echo "Fix: Git Version Control → Branch = cpanel-release → Update from Remote → Deploy HEAD Commit."; echo "Build branch: cpanel-release (from GitHub Actions). Target: /home/mmmedica/public_html/"; exit 1'
