---
# Runs in the Git repo checkout — builds Vite, copies only dist/ to document root.
# Confirm DEPLOYPATH matches cPanel → Domains → document root.
# Put .env.production in this repo folder (not in public_html). See .env.production.example

deployment:
  tasks:
    - export DEPLOYPATH=/home/mmmedica/public_html/
    - export NODE_ENV=production
    - node -v >/dev/null 2>&1 || (/bin/echo "ERROR: node not in PATH — enable Node 18+ in cPanel" && /bin/false)
    - npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
    - /bin/test -f .env.production || /bin/echo "WARNING: .env.production missing — Supabase may not work until you add VITE_* keys"
    - npm run build
    - /bin/test -d dist || (/bin/echo "ERROR: dist/ missing after npm run build" && /bin/false)
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -R dist/. "$DEPLOYPATH"
