---
# Git clone: /home/mmmedica/repositories/m2mmedical
# Document root: /home/mmmedica/public_html/
# Recommended branch in cPanel: cpanel-release (built static files, no Node).
# Each task line is a separate shell — use single /bin/sh -c blocks.

deployment:
  tasks:
    - /bin/sh -c 'set -eu; DEPLOYPATH=$(tr -d "\r\n\t " < deploy/DEPLOYPATH 2>/dev/null || true); test -n "$DEPLOYPATH" || DEPLOYPATH=/home/mmmedica/public_html/; REPO=/home/mmmedica/repositories/m2mmedical; cd "$REPO"; echo "=== M2M deploy (main) -> $DEPLOYPATH ==="; if test -f index.html && test ! -f dist/index.html; then echo "Detected cpanel-release layout at repo root."; SRC=.; PUBLISH=./cpanel-publish.sh; elif test -f dist/index.html; then SRC=dist; PUBLISH=./scripts/cpanel-publish.sh; else echo "ERROR: No built site in this checkout. In cPanel Git: set branch to cpanel-release, Update from Remote, Deploy HEAD Commit. Do not rely on npm on shared hosting unless Node is confirmed."; exit 1; fi; chmod +x "$PUBLISH" 2>/dev/null || true; /bin/sh "$PUBLISH" "$DEPLOYPATH" "$SRC"; echo "Done (merge only — unrelated public_html files kept)."'
