# Builds dist/ and updates branch cpanel-release for cPanel Git deploy (no Node on shared hosting).
# Secrets: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY (never service role)

name: cPanel production build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: cpanel-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Confirm deploy path
        run: |
          DEPLOYPATH=$(tr -d '\r\n\t ' < deploy/DEPLOYPATH)
          echo "DEPLOYPATH=$DEPLOYPATH"
          test "$DEPLOYPATH" = "/home/mmmedica/public_html/" || (echo "Unexpected DEPLOYPATH — update workflow if document root changed" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify dist output
        run: node scripts/verify-dist.mjs

      - name: Stamp deploy manifest
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'dist/DEPLOY_MANIFEST.json'
          const m = JSON.parse(fs.readFileSync(path, 'utf8'))
          m.cpanelGitBranch = 'cpanel-release'
          m.sourceMainCommit = process.env.GITHUB_SHA
          m.deployTarget = '/home/mmmedica/public_html/'
          m.cpanelClonePath = '/home/mmmedica/repositories/m2mmedical'
          fs.writeFileSync(path, JSON.stringify(m, null, 2))
          console.log('Deploy manifest:', m)
          NODE

      - name: Prepare cpanel-release bundle
        run: |
          DEPLOYPATH=$(tr -d '\r\n\t ' < deploy/DEPLOYPATH)
          sed "s|__DEPLOYPATH__|${DEPLOYPATH}|g" deploy/cpanel-static-deploy.yml > dist/.cpanel.yml
          cp scripts/cpanel-publish.sh dist/cpanel-publish.sh
          cp deploy/CPANEL_BRANCH dist/CPANEL_BRANCH
          cp deploy/vercel-cpanel-release.json dist/vercel.json
          chmod +x dist/cpanel-publish.sh

      - name: Publish cpanel-release branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: cpanel-release
          single-commit: true
          commit-message: 'deploy: static build for public_html'

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: m2m-dist
          path: dist/
          retention-days: 14
